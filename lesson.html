<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок WordSprint</title>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0b0f19; --card: #131a2a; --input-bg: #0d1322; --border: #232d45;
      --text: #f1f5f9; --muted: #94a3b8; --primary: #6366f1; --accent: #10b981; --danger: #ef4444;
    }
    [data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --input-bg: #f1f5f9; --border: #cbd5e1;
      --text: #0f172a; --muted: #475569; --primary: #4f46e5; --accent: #059669; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header { border-bottom: 1px solid var(--border); background: var(--card); }
    .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .logo { font-weight: 800; font-size: 1.25rem; }
    .theme-btn { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 26px; margin-top: 26px; }
    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .desc { color: var(--muted); font-size: 0.94rem; margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 1rem; outline: none; }
    .btn { width: 100%; padding: 13px 18px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.96rem; cursor: pointer; background: var(--primary); color: #fff; margin-top: 14px; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-sec { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
    .word-box { text-align: center; padding: 24px 14px; background: var(--input-bg); border-radius: 14px; border: 1px solid var(--border); margin: 16px 0; }
    .en-word { font-size: 1.9rem; font-weight: 800; }
    .opt-btn { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 0.98rem; text-align: left; cursor: pointer; margin-bottom: 8px; }
    .opt-btn.ok { background: rgba(16, 185, 129, 0.2); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .opt-btn.bad { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo">⚡ WordSprint</a>
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
  </div>
</header>

<main class="container" style="padding-bottom: 60px;">
  <div id="enterBox" class="card">
    <h1>📚 Интерактивный урок</h1>
    <p class="desc">Вы вошли под профилем <b id="lessonUserLabel" style="color:var(--accent);">—</b>. Введите код урока от преподавателя:</p>
    <label>Код урока (например, LESSON-4821)</label>
    <input type="text" id="lessonCodeInput" placeholder="LESSON-0000" style="text-transform:uppercase; font-family:monospace; font-weight:800; font-size:1.1rem;">
    <button class="btn btn-accent" onclick="loadLesson()">🚀 Начать урок</button>
  </div>

  <div id="theoryBox" class="card hidden">
    <h1 id="theoryTitle">Теория перед практикой</h1>
    <p id="theoryBody" style="white-space:pre-line; color:var(--text); margin:14px 0; line-height:1.7;"></p>
    <button class="btn btn-accent" onclick="startQuizWords()">▶ Перейти к упражнениям</button>
  </div>

  <div id="quizBox" class="card hidden">
    <div style="display:flex; justify-content:space-between; color:var(--muted); font-weight:700; font-size:0.9rem;">
      <span id="lessonHeaderTitle">Урок</span>
      <span>Слово <b id="qStep">1</b> / <b id="qTotal">10</b></span>
    </div>
    <div class="word-box">
      <div class="en-word" id="qWord">word</div>
      <div id="qHint" style="color:var(--muted); font-size:0.88rem; margin-top:6px;"></div>
      <button onclick="speakWord()" style="margin-top:10px; background:rgba(99,102,241,0.16); color:var(--primary); border:1px solid rgba(99,102,241,0.35); padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600;">🔊 Озвучить</button>
    </div>
    <div id="optionsContainer"></div>
    <div id="spellContainer" class="hidden">
      <input type="text" id="spellInput" placeholder="Напишите слово по-английски..." onkeydown="if(event.key==='Enter') checkSpell()">
      <button class="btn" onclick="checkSpell()">Проверить</button>
    </div>
  </div>

  <div id="finishBox" class="card hidden" style="text-align:center;">
    <div style="font-size:3rem;">🎉</div>
    <h1 style="margin:8px 0;">Урок завершён!</h1>
    <p class="desc" id="finalScoreText"></p>
    <button class="btn" id="retryMistakesBtn" onclick="retryMistakes()">🔁 Повторить ошибки</button>
    <a href="profile.html" class="btn btn-sec" style="display:inline-flex; justify-content:center;">👤 Вернуться в профиль</a>
  </div>
</main>
<script>
  let me = null, currentLesson = null, wordsList = new Array(), idx = 0, mistakes = new Array(), locked = false;

  window.addEventListener('DOMContentLoaded', () => {
    me = getCurrentUserProfile();
    if (!me || !me.user_id) {
      window.location.href = `profile.html?return=${encodeURIComponent(window.location.href)}`;
      return;
    }
    document.getElementById('lessonUserLabel').textContent = `${me.full_name || me.nickname} (${me.user_id})`;
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      document.getElementById('lessonCodeInput').value = code.toUpperCase();
      loadLesson();
    }
  });

  async function loadLesson() {
    const code = document.getElementById('lessonCodeInput').value.trim().toUpperCase();
    if (!code) return alert('Введите код урока!');
    try {
      const rows = await sbFetch('lessons', { query: `code=eq.${encodeURIComponent(code)}` });
      const lesson = sbFirst(rows);
      if (!lesson) return alert('Урок с таким кодом не найден.');
      if (lesson.lesson_status === 'closed') return alert('Преподаватель закрыл приём ответов по этому уроку.');

      currentLesson = lesson;
      wordsList = Array.from(lesson.words || new Array());
      if (lesson.settings && lesson.settings.shuffle) wordsList.sort(() => Math.random() - 0.5);

      document.getElementById('enterBox').classList.add('hidden');
      if (lesson.theory_text && lesson.theory_text.trim()) {
        document.getElementById('theoryTitle').textContent = lesson.title;
        document.getElementById('theoryBody').textContent = lesson.theory_text;
        document.getElementById('theoryBox').classList.remove('hidden');
      } else {
        startQuizWords();
      }
    } catch (e) { alert('Ошибка загрузки урока: ' + e.message); }
  }

  function startQuizWords() {
    document.getElementById('theoryBox').classList.add('hidden');
    document.getElementById('quizBox').classList.remove('hidden');
    document.getElementById('lessonHeaderTitle').textContent = currentLesson.title;
    idx = 0; mistakes = new Array();
    renderQuestion();
  }

  function speakWord() {
    const cur = wordsList.at(idx);
    if (!cur) return;
    const u = new SpeechSynthesisUtterance(cur.en);
    u.lang = 'en-US'; u.rate = 0.92;
    speechSynthesis.speak(u);
  }

  function renderQuestion() {
    locked = false;
    const cur = wordsList.at(idx);
    if (!cur) return finishLesson();

    document.getElementById('qStep').textContent = idx + 1;
    document.getElementById('qTotal').textContent = wordsList.length;
    document.getElementById('qHint').textContent = cur.hint || '';

    const mode = currentLesson.mode || 'translate';
    const optBox = document.getElementById('optionsContainer');
    const spellBox = document.getElementById('spellContainer');
    optBox.innerHTML = '';
    spellBox.classList.add('hidden');

    if (mode === 'spelling') {
      document.getElementById('qWord').textContent = cur.ru;
      document.getElementById('spellInput').value = '';
      spellBox.classList.remove('hidden');
      return;
    }

    document.getElementById('qWord').textContent = mode === 'listening' ? '🎧 • • • • •' : cur.en;
    speakWord();

    const wrongs = wordsList.filter(w => w.ru !== cur.ru).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.ru);
    while (wrongs.length < 3) wrongs.push(`Вариант ${wrongs.length + 1}`);
    const opts = new Array(cur.ru, ...wrongs).sort(() => Math.random() - 0.5);

    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = o;
      b.onclick = () => {
        if (locked) return;
        locked = true;
        document.getElementById('qWord').textContent = cur.en;
        if (o === cur.ru) b.classList.add('ok');
        else {
          b.classList.add('bad');
          mistakes.push(cur);
          document.querySelectorAll('.opt-btn').forEach(x => { if (x.textContent === cur.ru) x.classList.add('ok'); });
        }
        setTimeout(() => { idx++; renderQuestion(); }, 650);
      };
      optBox.appendChild(b);
    });
  }

  function checkSpell() {
    if (locked) return;
    locked = true;
    const cur = wordsList.at(idx);
    const val = document.getElementById('spellInput').value.trim().toLowerCase();
    if (val !== cur.en.toLowerCase()) mistakes.push(cur);
    speakWord();
    setTimeout(() => { idx++; renderQuestion(); }, 650);
  }

  async function finishLesson() {
    document.getElementById('quizBox').classList.add('hidden');
    document.getElementById('finishBox').classList.remove('hidden');

    const total = wordsList.length;
    const score = Math.max(0, total - mistakes.length);
    const pct = Math.round((score / Math.max(1, total)) * 100);
    const studentName = me.full_name || me.nickname;

    document.getElementById('finalScoreText').textContent = `${studentName}, ваш результат: ${score} из ${total} (${pct}%)`;
    document.getElementById('retryMistakesBtn').classList.toggle('hidden', mistakes.length === 0);

    try {
      await sbFetch('lesson_results', {
        method: 'POST',
        body: {
          lesson_code: currentLesson.code,
          student_name: studentName,
          score, total,
          mistakes: mistakes.map(m => m.en),
          is_checked: false
        }
      });
    } catch (e) { console.error(e); }
  }

  function retryMistakes() {
    wordsList = Array.from(mistakes);
    document.getElementById('finishBox').classList.add('hidden');
    startQuizWords();
  }
</script>
</body>
</html>
